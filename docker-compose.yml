version: "3.9"

services:

  # ── 1. PostgreSQL with pgvector ──────────────────────────
  postgres:
    image: pgvector/pgvector:pg16
    container_name: documind_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 2. Redis ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: documind_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── 3. FastAPI (main API) ─────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - uploads_data:/app/uploads
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/live" ]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ── 4. Celery Worker ──────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: documind_worker
    command: celery -A worker.celery_app worker --loglevel=info --concurrency=2
    env_file:
      - .env
    volumes:
      - ./:/app
      - uploads_data:/app/uploads
      - huggingface_cache:/app/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── 5. Celery Beat (scheduler) ────────────────────────────
  beat:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: documind_beat
    command: celery -A worker.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # ── 6. Flower (Celery monitor) ────────────────────────────
  flower:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: documind_flower
    command: celery -A worker.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - redis
    restart: unless-stopped

  # ── 7. MCP Server (AI agent tools) ───────────────────────
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: documind_mcp
    command: uvicorn mcp.server:app --host 0.0.0.0 --port 8001 --reload
    ports:
      - "8001:8001"
    env_file:
      - .env
    volumes:
      - ./:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

# ── Named Volumes ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  uploads_data:
  huggingface_cache:
