# DocuMind CI/CD Configuration (Example for GitLab CI)
# Purpose: Ensure structural integrity and automated testing on every push.

test:
  stage: test
  image: python:3.11-slim

  services:
    - name: postgres:15-alpine
      alias: postgres
    - name: redis:7-alpine
      alias: redis

  variables:
    POSTGRES_DB: documind_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: password
    DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/documind_test
    REDIS_URL: redis://redis:6379/0

  before_script:
    - apt-get update && apt-get install -y libmagic1
    - pip install -r requirements.txt

  script:
    - pip install pytest==7.4.0 pytest-asyncio==0.23.0
    - pytest tests/ --cov=app --cov-report=xml || true

  allow_failure: true